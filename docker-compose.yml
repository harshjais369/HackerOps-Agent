services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackerops-backend
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./hackerops.db
      - ALLOW_LOCAL_TARGETS=false
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.5-flash}
      - CORS_ORIGINS=*
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackerops-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hackerops-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.sandbox
    image: hackerops-sandbox:latest
    container_name: hackerops-sandbox-base
    restart: "no"
